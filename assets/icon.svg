<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6cf0"/>
      <stop offset="100%" stop-color="#35228a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0eaff"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- A cockpit dial: an open arc, a needle past its middle, and the hub it
       turns on. The same reduced-geometry, glowing-white language as the
       sibling app icons. -->
  <g filter="url(#soft)" fill="none" stroke="url(#glow)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 256 660 A 290 290 0 1 1 768 660"/>
    <path d="M 512 560 L 648 372"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="512" cy="560" r="54" fill="url(#glow)"/>
    <circle cx="256" cy="660" r="30" fill="url(#glow)"/>
    <circle cx="768" cy="660" r="30" fill="url(#glow)"/>
  </g>
</svg>
